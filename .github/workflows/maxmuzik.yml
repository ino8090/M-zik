name: MaxMuzik Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Safely Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
            echo "Cookie dosyasi eklendi."
          else
            echo "" > cookies.txt
            echo "Cookie secret bulunamadi, bos dosya olusturuldu."
          fi

      - name: Run Stream Script
        run: python maxmuzik.py
