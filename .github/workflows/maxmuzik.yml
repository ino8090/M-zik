name: maxmuzik

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları ve Sistem Paketlerini Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Canlı Yayını Başlat
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          M3U_URL: ${{ secrets.M3U_URL }}
          LOGO_URL: ${{ secrets.LOGO_URL }}
          STATE_FILE_NAME: "maxmuzik.json"
        run: |
          python maxmuzik.py
